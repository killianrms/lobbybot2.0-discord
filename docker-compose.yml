# Déploiement vm-prod : suppose les projets frères et le dossier data au même niveau :
#   apps/
#   ├── lobbybot2.0-discord/   (ce repo)
#   ├── lobbybot2.0-website/
#   ├── fn_account_generator/  (repo privé, transféré manuellement)
#   └── data/                  (lobbybot.db partagée + backups/ — hors git)
services:
  postgres:
    image: postgres:17-alpine
    container_name: lobbybot-postgres
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_DB: lobbybot
      # Secrets dans le .env de ce dossier (gitignoré) — substitution docker compose
      POSTGRES_PASSWORD: ${POSTGRES_SUPER_PASSWORD:?à définir dans .env}
      LOBBYBOT_DB_PASSWORD: ${LOBBYBOT_DB_PASSWORD:?à définir dans .env}
      GENERATOR_DB_PASSWORD: ${GENERATOR_DB_PASSWORD:?à définir dans .env}
    ports:
      # localhost + IP Tailscale de la VM uniquement — jamais le LAN entier ni public.
      # Le bind sur l'IP Tailscale exige net.ipv4.ip_nonlocal_bind=1 (voir
      # /etc/sysctl.d/99-docker-tailscale-bind.conf sur la VM) pour survivre à un
      # démarrage de Docker avant tailscaled.
      - "127.0.0.1:5432:5432"
      - "100.108.56.39:5432:5432"
    volumes:
      - ../data/postgres:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lobbybot"]
      interval: 10s
      timeout: 5s
      retries: 10

  website:
    build: ../lobbybot2.0-website
    container_name: lobbybot-website
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: ../lobbybot2.0-website/.env
    volumes:
      - ../data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  manager:
    build: .
    container_name: lobbybot-manager
    restart: unless-stopped
    env_file: .env
    volumes:
      - ../data:/app/data
      - ../fn_account_generator:/app/generator
    depends_on:
      - website

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      # local + Tailscale uniquement (tailscale serve proxifie vers 127.0.0.1)
      - "127.0.0.1:3001:3001"
      - "192.168.1.11:3001:3001"
    volumes:
      - ../data/uptime-kuma:/app/data
